<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View one order - BuildPro Order Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <p class="app-name">BuildPro <span>Order Manager</span></p>
        <p class="logged-user" id="logged-user"></p>
    </header>

    <main>
        <section class="card">
            <h1>View one order</h1>
            <p>Enter the code of the order you want to view.</p>

            <form id="search-form" novalidate>
                <div class="form-row">
                    <label for="code">Order code</label>
                    <input type="text" id="code" name="code" maxlength="20" placeholder="ORD-001">
                </div>

                <div id="search-message" class="message" hidden></div>

                <div class="button-bar">
                    <button type="submit">Show order</button>
                    <button type="button" class="secondary" data-go="ordersMenu.html">Back to orders view menu</button>
                    <button type="button" class="secondary" data-go="menu.html">Back to operations menu</button>
                    <button type="button" class="secondary" data-go="index.html">Back to start</button>
                </div>
            </form>
        </section>
    </main>

    <script src="utils.js"></script>
    <script src="searchOrder.js"></script>
</body>
</html>

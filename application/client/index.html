<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildPro Order Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section class="card hero">
            <!-- Application logo: a brick wall with a roof -->
            <svg class="logo" viewBox="0 0 120 120" role="img" aria-label="BuildPro Order Manager logo">
                <polygon points="60,8 112,50 8,50" fill="#2f3640"/>
                <rect x="14" y="50" width="92" height="62" fill="#e8710a"/>
                <g stroke="#f4f1ec" stroke-width="3">
                    <line x1="14" y1="65" x2="106" y2="65"/>
                    <line x1="14" y1="81" x2="106" y2="81"/>
                    <line x1="14" y1="97" x2="106" y2="97"/>
                    <line x1="44" y1="50" x2="44" y2="65"/>
                    <line x1="76" y1="50" x2="76" y2="65"/>
                    <line x1="30" y1="65" x2="30" y2="81"/>
                    <line x1="60" y1="65" x2="60" y2="81"/>
                    <line x1="90" y1="65" x2="90" y2="81"/>
                    <line x1="44" y1="81" x2="44" y2="97"/>
                    <line x1="76" y1="81" x2="76" y2="97"/>
                    <line x1="30" y1="97" x2="30" y2="112"/>
                    <line x1="60" y1="97" x2="60" y2="112"/>
                    <line x1="90" y1="97" x2="90" y2="112"/>
                </g>
            </svg>
            <h1>BuildPro Order Manager</h1>
            <p class="subtitle">Order management for BuildPro Construction Supplies</p>

            <div id="start-message" class="message" hidden></div>

            <div class="button-bar">
                <button type="button" class="secondary" data-go="documentation.html">Description and documentation</button>
                <button type="button" data-go="login.html">Log in</button>
            </div>
        </section>
    </main>
    <footer class="app-footer">BuildPro Construction Supplies &middot; European store chain</footer>

    <script src="utils.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations menu - BuildPro Order Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <p class="app-name">BuildPro <span>Order Manager</span></p>
        <p class="logged-user" id="logged-user"></p>
    </header>

    <main>
        <section class="card">
            <h1>Operations menu</h1>
            <p>Select the operation you want to carry out and click the access button.</p>

            <div class="form-row">
                <label for="operation">Available operations</label>
                <select id="operation">
                    <option value="">-- Select an operation --</option>
                    <option value="newOrder">Create a new order</option>
                    <option value="viewOrders">View orders</option>
                </select>
            </div>

            <div id="menu-message" class="message" hidden></div>

            <div class="button-bar">
                <button type="button" id="operation-button">Go to selected operation</button>
                <button type="button" class="secondary" data-go="index.html">Back to start</button>
            </div>
        </section>
    </main>

    <script src="utils.js"></script>
    <script src="menu.js"></script>
</body>
</html>
